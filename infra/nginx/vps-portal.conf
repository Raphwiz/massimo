server {
  listen 80;
  server_name portal.stdorothyschool.ac.ke;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# After DNS is pointed to the VPS, obtain a Let's Encrypt certificate and replace
# this HTTP-only server block with the HTTPS configuration described in DEPLOYMENT.md.
