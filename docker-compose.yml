services:
  postgres:
    image: postgres:16-alpine
    container_name: st-dorothy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: st_dorothy_school
      POSTGRES_USER: st_dorothy_app
      POSTGRES_PASSWORD: change-this-before-use
    ports:
      - "5432:5432"
    volumes:
      - st_dorothy_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U st_dorothy_app -d st_dorothy_school"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  st_dorothy_postgres:
